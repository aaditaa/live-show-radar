name: Scan for live shows

on:
  schedule:
    # Every 30 minutes. GitHub queues cron runs under load, so treat this as
    # "about every 30 minutes" rather than a guarantee.
    - cron: '*/30 * * * *'
  workflow_dispatch:

concurrency:
  # Never let a slow scan overlap the next scheduled one.
  group: live-show-radar-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Trigger scan
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail

          if [ -z "${APP_URL:-}" ] || [ -z "${CRON_SECRET:-}" ]; then
            echo "::error::APP_URL and CRON_SECRET must be set as repository secrets."
            exit 1
          fi

          # --fail-with-body so a non-2xx fails the step but still prints why.
          http_code=$(curl \
            --silent \
            --show-error \
            --fail-with-body \
            --max-time 300 \
            --retry 2 \
            --retry-delay 10 \
            --retry-connrefused \
            --write-out '%{http_code}' \
            --output scan-response.json \
            --header "Authorization: Bearer ${CRON_SECRET}" \
            "${APP_URL}/api/scan?trigger=github_actions") || {
              echo "::error::Scan request failed."
              cat scan-response.json || true
              exit 1
            }

          echo "HTTP ${http_code}"
          cat scan-response.json
          echo ""

          # Surface the headline numbers in the Actions run summary.
          {
            echo "### Scan result"
            echo ""
            echo '```json'
            cat scan-response.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
